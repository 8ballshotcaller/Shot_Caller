/* ============================================================
   ENLARGED BALLS
   ============================================================ */

function setupBallCanvas(el){

  const rect=
    el.getBoundingClientRect();

  el.width=
    Math.max(
      1,
      Math.round(
        rect.width*DPR
      )
    );

  el.height=
    Math.max(
      1,
      Math.round(
        rect.height*DPR
      )
    );

  return el.getContext("2d");
}

function largeBall(
  c,
  type,
  number
){

  const w=
    c.canvas.width;

  const h=
    c.canvas.height;

  c.clearRect(
    0,
    0,
    w,
    h
  );

  const x=w/2;
  const y=h/2;

  const r=
    Math.min(
      w,
      h
    )*.36;

  if(
    type==="cue"
  ){

    const gradient=
      c.createRadialGradient(
        x-r*.36,
        y-r*.42,
        r*.02,
        x,
        y,
        r
      );

    gradient.addColorStop(
      0,
      "#ffffff"
    );

    gradient.addColorStop(
      .76,
      "#f0f0f0"
    );

    gradient.addColorStop(
      1,
      "#c2c6c8"
    );

    c.beginPath();

    c.arc(
      x,
      y,
      r,
      0,
      Math.PI*2
    );

    c.fillStyle=gradient;

    c.fill();

    c.strokeStyle=
      "rgba(0,0,0,.25)";

    c.lineWidth=
      Math.max(
        1,
        r*.025
      );

    c.stroke();

    return{
      x,
      y,
      r
    };
  }

  const ball=
    BALL_MAP[number];

  if(!ball){

    return{
      x,
      y,
      r
    };
  }

  c.save();

  c.beginPath();

  c.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  c.clip();

  c.fillStyle=
    ball.color;

  c.fillRect(
    x-r,
    y-r,
    r*2,
    r*2
  );

  if(
    ball.type==="stripe"
  ){

    c.fillStyle="#f7f7f7";

    c.fillRect(
      x-r,
      y-r*.30,
      r*2,
      r*.60
    );
  }

  const shade=
    c.createRadialGradient(
      x-r*.38,
      y-r*.40,
      r*.04,
      x,
      y,
      r
    );

  shade.addColorStop(
    0,
    "rgba(255,255,255,.34)"
  );

  shade.addColorStop(
    .32,
    "rgba(255,255,255,0)"
  );

  shade.addColorStop(
    .82,
    "rgba(0,0,0,0)"
  );

  shade.addColorStop(
    1,
    "rgba(0,0,0,.20)"
  );

  c.fillStyle=shade;

  c.fillRect(
    x-r,
    y-r,
    r*2,
    r*2
  );

  c.restore();

  c.beginPath();

  c.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  c.strokeStyle=
    "rgba(0,0,0,.42)";

  c.lineWidth=
    Math.max(
      1,
      r*.025
    );

  c.stroke();

  c.beginPath();

  c.arc(
    x,
    y,
    r*.39,
    0,
    Math.PI*2
  );

  c.fillStyle="#fafafa";

  c.fill();

  c.strokeStyle=
    "rgba(0,0,0,.65)";

  c.lineWidth=
    Math.max(
      1.5,
      r*.035
    );

  c.stroke();

  c.fillStyle="#111";

  c.font=
    `900 ${Math.max(
      10,
      r*.50
    )}px Arial`;

  c.textAlign="center";

  c.textBaseline="middle";

  c.fillText(
    number,
    x,
    y+.5
  );

  return{
    x,
    y,
    r
  };
}

/* ============================================================
   ACCURATE CONTACT DOT
   ============================================================ */

/*
  The red dot is placed from the exact same contact vector
  that generates the written contact description.

  It is deliberately small enough to resemble a cue-tip
  contact point rather than an oversized target marker.
*/

function drawContactMarker(
  c,
  ball,
  direction,
  distanceFactor=.92,
  showGuide=false
){

  if(
    !ball||
    !direction||
    len(direction)<.01
  ){
    return;
  }

  const markerDistance=
    ball.r*
    clamp(
      distanceFactor,
      .35,
      .96
    );

  const markerRadius=
    Math.max(
      2.5,
      ball.r*.105
    );

  const x=
    ball.x+
    direction.x*
    markerDistance;

  const y=
    ball.y+
    direction.y*
    markerDistance;

  if(showGuide){

    c.beginPath();

    c.moveTo(
      ball.x,
      ball.y
    );

    c.lineTo(
      x,
      y
    );

    c.strokeStyle=
      "rgba(255,70,82,.58)";

    c.lineWidth=
      Math.max(
        1.2,
        ball.r*.035
      );

    c.setLineDash(
      [
        Math.max(2,ball.r*.08),
        Math.max(3,ball.r*.12)
      ]
    );

    c.stroke();
    c.setLineDash([]);
  }

  c.beginPath();

  c.arc(
    x,
    y,
    markerRadius,
    0,
    Math.PI*2
  );

  c.fillStyle="#ff4652";

  c.fill();

  c.strokeStyle=
    "rgba(0,0,0,.82)";

  c.lineWidth=
    Math.max(
      .8,
      markerRadius*.12
    );

  c.stroke();
}

function drawCenterMarker(
  c,
  ball
){

  const markerRadius=
    Math.max(
      2.5,
      ball.r*.105
    );

  c.beginPath();

  c.arc(
    ball.x,
    ball.y,
    markerRadius,
    0,
    Math.PI*2
  );

  c.fillStyle="#ff4652";

  c.fill();

  c.strokeStyle=
    "rgba(0,0,0,.82)";

  c.lineWidth=
    Math.max(
      .8,
      markerRadius*.12
    );

  c.stroke();
}

function drawCueCrosshair(
  c,
  ball
){
  c.save();

  c.beginPath();

  c.arc(
    ball.x,
    ball.y,
    ball.r*.86,
    0,
    Math.PI*2
  );

  c.clip();

  c.strokeStyle=
    "rgba(42,55,60,.42)";

  c.lineWidth=
    Math.max(
      1,
      ball.r*.018
    );

  c.setLineDash(
    [3,4]
  );

  c.beginPath();

  c.moveTo(
    ball.x-ball.r*.78,
    ball.y
  );

  c.lineTo(
    ball.x+ball.r*.78,
    ball.y
  );

  c.moveTo(
    ball.x,
    ball.y-ball.r*.78
  );

  c.lineTo(
    ball.x,
    ball.y+ball.r*.78
  );

  c.stroke();
  c.setLineDash([]);
  c.restore();
}

function renderedAimDirection(s){
  if(!s){
    return V(0,0);
  }

  const contact=s.kind==="combination"
    ?s.firstContactPoint
    :s.ghost;

  if(!contact){
    return V(0,0);
  }

  /*
    Derive the aiming vector from the two points after the table's
    responsive transform has been applied. This avoids CSS-pixel
    offsets and keeps the cue dot aligned at every table size.
  */
  const cueScreen=toScreen(state.cue);
  const contactScreen=toScreen(contact);
  const renderedVector=V(
    contactScreen.x-cueScreen.x,
    contactScreen.y-cueScreen.y
  );

  return norm(renderedVector);
}

function drawCueView(c){

  const ball=
    largeBall(
      c,
      "cue"
    );

  drawCueCrosshair(
    c,
    ball
  );

  const s=
    state.solution;

  if(!s){
    return;
  }

  /*
    TIP PLACEMENT ONLY.
    This is the exact vector the sentence describes.
  */
  const direction=
    shotCall(s).tipVector;

  if(
    len(direction)<.02
  ){

    drawCenterMarker(
      c,
      ball
    );

    return;
  }

  drawContactMarker(
    c,
    ball,
    direction,
    .48+
      len(direction)*.62
  );
}

function drawObjectView(c){

  const s=
    state.solution;

  const displayedNumber=
    s&&
    s.kind==="combination"
      ?s.combinationBall.number
      :state.object.number;

  const ball=
    largeBall(
      c,
      "object",
      displayedNumber
    );

  if(!s){
    return;
  }

  /*
    CONTACT POINT ONLY.
    Same vector the sentence describes.
  */
  const direction=
    shotCall(s).objectVector;

  if(
    len(direction)<.02
  ){

    drawCenterMarker(
      c,
      ball
    );

    return;
  }

  drawContactMarker(
    c,
    ball,
    direction,
    .92,
    false
  );
}

function drawTargetView(c){

  const s=
    state.solution;

  if(
    !s||
    s.kind!=="combination"
  ){
    return;
  }

  const ball=
    largeBall(
      c,
      "object",
      s.targetBall.number
    );

  const direction=
    shotCall(s).targetVector;

  if(
    len(direction)<.02
  ){

    drawCenterMarker(
      c,
      ball
    );

    return;
  }

  drawContactMarker(
    c,
    ball,
    direction,
    .92,
    true
  );
}

function drawBallViews(){

  const cueContext=
    setupBallCanvas(
      document.getElementById(
        "cueView"
      )
    );

  const objectContext=
    setupBallCanvas(
      document.getElementById(
        "objectView"
      )
    );

  const targetContext=
    setupBallCanvas(
      document.getElementById(
        "targetView"
      )
    );

  drawCueView(
    cueContext
  );

  drawObjectView(
    objectContext
  );

  drawTargetView(
    targetContext
  );
}

/* ============================================================
   MASTER DRAW
   ============================================================ */

function draw(){

  drawTable();

  /*
    Route and ghost ball are drawn before the actual balls,
    so the ghost ball never disappears behind an object ball.
  */
  drawRoute();

  drawBalls();

  drawBallViews();
}

/* ============================================================
   UI RENDER
   ============================================================ */

function render(){

  const s=
    state.solution;

  document.getElementById(
    "whereBall"
  ).textContent=
    state.object&&
    state.object.number
      ?state.object.number
      :"—";

  document.getElementById(
    "shotType"
  ).textContent=
    s
      ?(
        s.kind==="combination"
          ?"Combo"
          :s.kind==="straight"
            ?"Straight"
            :capitalize(s.kind)
      )
      :"—";

  document.getElementById(
    "shotPocket"
  ).textContent=
    s
      ?titleCasePocket(s.pocket.name)
      :"—";

  document.getElementById(
    "shotRail"
  ).textContent=
    s&&s.rail
      ?titleCaseRail(
          s.rail
        )
      :"—";

  document.getElementById(
    "shotSpeed"
  ).textContent=
    s
      ?speedForShot(s)
      :"—";

  document.getElementById(
    "instruction"
  ).innerHTML=
    instructionHTML(s);

  const whereGrid=
    document.getElementById(
      "whereGrid"
    );

  whereGrid.classList.toggle(
    "combo",
    !!(
      s&&
      s.kind==="combination"
    )
  );

  document.getElementById(
    "objectViewLabel"
  ).textContent=
    s&&
    s.kind==="combination"
      ?"Combo Ball"
      :"Object Ball";

  document.getElementById(
    "targetViewLabel"
  ).textContent=
    s&&
    s.kind==="combination"
      ?"Target Ball"
      :"Target Ball";

  renderPockets();
  renderModes();
  renderRack();
  renderOwnership();

  draw();
}

function capitalize(text){

  if(!text){
    return text;
  }

  return(
    text.charAt(0).toUpperCase()+
    text.slice(1)
  );
}

function titleCasePocket(text){

  if(!text){
    return text;
  }

  return text
    .split(" ")
    .map(
      word=>
        word.charAt(0).toUpperCase()+
        word.slice(1).toLowerCase()
    )
    .join(" ");
}

function titleCaseRail(rail){

  return railText(rail)
    .split(" ")
    .map(
      word=>
        word.charAt(0).toUpperCase()+
        word.slice(1).toLowerCase()
    )
    .join(" ");
}

function renderPockets(){
  /*
    Pocket choice is intentionally canvas-only. The six real
    pocket mouths are rendered and hit-tested in table space.
    With no selected mouth the solver remains in suggested mode.
  */
}

/* ============================================================
   MODE UI
   ============================================================ */

function renderModes(){

  document.querySelectorAll(
    ".mode"
  ).forEach(
    button=>{

      const active=state.mode===button.dataset.mode;
      button.classList.toggle("active",active);
      button.setAttribute("aria-pressed",String(active));

      button.onclick=()=>{

        state.mode=
          button.dataset.mode;

        solve();
      };

    }
  );

}

/* ============================================================
   RACK
   ============================================================ */

function rackOrder(){

  return[
    [1],
    [2,3],
    [4,8,5],
    [6,7,9,10],
    [11,12,13,14,15]
  ];
}

function renderRack(){

  const rack=
    document.getElementById(
      "rack"
    );

  rack.innerHTML="";

  const placed=
    new Set(
      state.tableBalls.map(
        b=>b.number
      )
    );

  rackOrder().forEach(
    (numbers,index)=>{

      const row=
        document.createElement(
          "div"
        );

      row.className=
        `rack-row r${index+1}`;

      numbers.forEach(
        number=>{

          const ball=
            BALL_MAP[number];

          const tableBall=
            state.tableBalls.find(
              b=>
                b.number===
                number
            );

          const button=
            document.createElement(
              "button"
            );

          button.className=
            `rack-ball ${ball.type}`;

          button.style.setProperty(
            "--ball-color",
            ball.color
          );

          if(
            state.selectedRackBall===
            number
          ){
            button.classList.add(
              "selected"
            );
          }

          if(
            placed.has(number)
          ){
            button.classList.add(
              "on-table"
            );
          }

          if(
            state.object.number===
            number&&
            tableBall&&
            tableBall.owner==="target"
          ){
            button.classList.add(
              "object-ball"
            );
          }

          if(
            tableBall&&
            tableBall.owner==="my"
          ){
            button.classList.add(
              "my-ball"
            );
          }

          if(
            tableBall&&
            tableBall.owner==="opponent"
          ){
            button.classList.add(
              "opponent-ball"
            );
          }

          const span=
            document.createElement(
              "span"
            );

          span.textContent=
            number;

          button.appendChild(
            span
          );

          button.onclick=event=>{

            event.stopPropagation();

            selectRackBall(
              number
            );
          };

          row.appendChild(
            button
          );
        }
      );

      rack.appendChild(
        row
      );
    }
  );

  document.getElementById(
    "rackAccent"
  ).textContent=
    state.selectedRackBall
      ?`Ball ${state.selectedRackBall} Selected`
      :"Select";

  const deleteButton=
    document.getElementById(
      "deleteBall"
    );

  deleteButton.disabled=
    !getSelectedTableBall();
}

/* ============================================================
   RACK SELECTION
   ============================================================ */

function selectRackBall(
  number
){

  state.selectedRackBall=
    number;

  state.selectedBall=
    "object";

  const existing=
    state.tableBalls.find(
      b=>
        b.number===
        number
    );

  if(existing){

    if(
      existing.owner==="target"
    ){

      state.object={
        x:existing.x,
        y:existing.y,
        number
      };

    }else{

      const target=
        state.tableBalls.find(
          b=>
            b.owner==="target"
        );

      if(target){

        state.object={
          x:target.x,
          y:target.y,
          number:target.number
        };
      }
    }
  }

  solve();
}

/* ============================================================
   OWNERSHIP
   ============================================================ */

function getSelectedTableBall(){

  if(
    !state.selectedRackBall
  ){
    return null;
  }

  return state.tableBalls.find(
    b=>
      b.number===
      state.selectedRackBall
  )||null;
}

function setBallOwner(owner){

  if(state.selectedRackBall===8){ owner="target"; }

  const number=
    state.selectedRackBall;

  if(!number){
    return;
  }

  let ball=
    state.tableBalls.find(
      b=>
        b.number===
        number
    );

  /*
    If a rack ball is selected but not yet on the table,
    create it immediately. This makes ownership assignment
    reliable instead of requiring a separate hidden state.
  */
  if(!ball){

    const hasTarget=
      state.tableBalls.some(
        b=>
          b.owner==="target"
      );

    const newBall={
      number,
      x:state.object.x,
      y:state.object.y,
      owner:
        number===8
          ?"target"
          :owner==="target"
            ?"target"
            :hasTarget
              ?owner
              :"target",
      role:
        owner==="target"||
        !hasTarget
          ?"object"
          :"blocker"
    };

    /*
      If the requested location is occupied, place the new
      ball at a safe visible default position.
    */
    if(
      !validBallPosition(
        newBall,
        null
      )
    ){

      const candidates=[
        V(35,15),
        V(45,15),
        V(55,15),
        V(35,25),
        V(45,25),
        V(55,25),
        V(35,35),
        V(45,35),
        V(55,35)
      ];

      const safe=
        candidates.find(
          p=>
            validBallPosition(p)
        );

      if(safe){
        newBall.x=safe.x;
        newBall.y=safe.y;
      }
    }

    state.tableBalls.push(
      newBall
    );

    ball=newBall;
  }

  /*
    Target must always be unique.
  */
  if(
    owner==="target"
  ){

    state.tableBalls.forEach(
      b=>{

        if(
          b.number===
          number
        ){

          b.owner="target";
          b.role="object";

        }else if(
          b.owner==="target"
        ){

          b.owner="my";
          b.role="blocker";
        }

      }
    );

    state.object={
      x:ball.x,
      y:ball.y,
      number:ball.number
    };

  }else{

    ball.owner=owner;
    ball.role="blocker";

    /*
      If the target is changed into a player's or opponent's
      ball, another ball becomes the target.
    */
    if(
      state.object.number===
      ball.number
    ){

      const replacement=
        state.tableBalls.find(
          b=>
            b.number!==
            ball.number
        );

      if(replacement){

        replacement.owner="target";
        replacement.role="object";

        state.object={
          x:replacement.x,
          y:replacement.y,
          number:replacement.number
        };

        state.selectedRackBall=
          replacement.number;

      }else{

        ball.owner="target";
        ball.role="object";

        state.object={
          x:ball.x,
          y:ball.y,
          number:ball.number
        };
      }
    }
  }

  solve();
}

function deleteSelectedBall(){

  const selected=
    getSelectedTableBall();

  if(!selected){
    return;
  }

  const wasTarget=
    selected.owner==="target"||
    state.object&&
    state.object.number===
    selected.number;

  state.tableBalls=
    state.tableBalls.filter(
      ball=>
        ball.number!==
        selected.number
    );

  if(wasTarget){

    const replacement=
      state.tableBalls.find(
        ball=>
          ball.owner==="target"
      )||
      state.tableBalls[0]||
      null;

    if(replacement){

      state.tableBalls.forEach(
        ball=>{
          if(ball.number===replacement.number){
            ball.owner="target";
            ball.role="object";
          }else if(ball.owner==="target"){
            ball.owner="my";
            ball.role="blocker";
          }
        }
      );

      state.object={
        x:replacement.x,
        y:replacement.y,
        number:replacement.number
      };

      state.selectedRackBall=
        replacement.number;

    }else{

      state.object={
        x:65,
        y:20,
        number:null
      };

      state.selectedRackBall=null;
    }

  }else{
    state.selectedRackBall=null;
  }

  state.selectedBall=null;
  state.contactBall=null;
  solve();
}

document.getElementById(
  "deleteBall"
).onclick=deleteSelectedBall;

document.querySelectorAll(
  ".ownership-button"
).forEach(
  button=>{

    button.addEventListener(
      "click",
      event=>{

        event.preventDefault();
        event.stopPropagation();

        setBallOwner(
          button.dataset.owner
        );
      }
    );

  }
);

function renderOwnership(){

  const selected=
    getSelectedTableBall();

  document.querySelector(".ownership-section")?.classList.toggle("eight-ball-auto", selected?.number===8);

  const buttons=
    document.querySelectorAll(
      ".ownership-button"
    );

  buttons.forEach(
    button=>{

      button.classList.toggle(
        "active",
        !!(
          selected&&
          selected.owner===
          button.dataset.owner
        )
      );

    }
  );

  if(!selected){
    return;
  }

}

/* ============================================================
   HIT TEST
   ============================================================ */

function nearestBall(p){

  const touchRadius=
    Math.max(
      BALL_DIAMETER*1.7,
      4.4
    );

  if(
    dist(
      p,
      state.cue
    )<=touchRadius
  ){

    return{
      type:"cue"
    };
  }

  let best=null;
  let bestDistance=Infinity;

  for(
    const ball of
    state.tableBalls
  ){

    const d=
      dist(
        p,
        ball
      );

    if(
      d<=touchRadius&&
      d<bestDistance
    ){

      best=ball;

      bestDistance=d;
    }
  }

  if(best){

    return{
      type:"object",
      number:best.number,
      role:best.role
    };
  }

  return null;
}

function nearestPocket(p){
  const hitRadius=Math.max(POCKET_SIZE*1.45,5.2);
  let nearest=null;
  let nearestDistance=Infinity;

  for(const pocket of POCKETS){
    const d=dist(p,pocket);
    if(d<=hitRadius&&d<nearestDistance){
      nearest=pocket;
      nearestDistance=d;
    }
  }

  return nearest;
}

/* ============================================================
   VALID POSITION
   ============================================================ */

function validBallPosition(
  p,
  movingNumber=null,
  movingCue=false
){

  if(
    !centerInside(p)
  ){
    return false;
  }

  if(
    !movingCue&&
    dist(
      p,
      state.cue
    )<BALL_DIAMETER
  ){
    return false;
  }

  for(
    const ball of
    state.tableBalls
  ){

    if(
      ball.number===
      movingNumber
    ){
      continue;
    }

    if(
      dist(
        p,
        ball
      )<BALL_DIAMETER
    ){
      return false;
    }
  }

  return true;
}

/* ============================================================
   TABLE INTERACTION
   ============================================================ */

function tablePoint(p){
  return V(
    clamp(
      p.x,
      BALL_RADIUS,
      TABLE_W-BALL_RADIUS
    ),
    clamp(
      p.y,
      BALL_RADIUS,
      TABLE_H-BALL_RADIUS
    )
  );
}

function moveSelectedBall(p){
  if(
    !state.selectedBall
  ){
    return false;
  }

  const next=
    tablePoint(p);

  if(
    state.selectedBall==="cue"
  ){
    if(
      !validBallPosition(
        next,
        null,
        true
      )
    ){
      return false;
    }

    state.cue=next;
    solve();
    return true;
  }

  const number=
    state.selectedRackBall;

  if(!number){
    return false;
  }

  const existing=
    state.tableBalls.find(
      b=>
        b.number===
        number
    );

  if(existing){
    if(
      !validBallPosition(
        next,
        number
      )
    ){
      return false;
    }

    existing.x=next.x;
    existing.y=next.y;

    if(
      existing.owner==="target"
    ){
      state.object={
        x:next.x,
        y:next.y,
        number
      };
    }
  }else{
    if(
      !validBallPosition(next)
    ){
      return false;
    }

    const hasTarget=
      state.tableBalls.some(
        b=>
          b.owner==="target"
      );

    const newBall={
      number,
      x:next.x,
      y:next.y,
      owner:
        number===8
          ?"target"
          :hasTarget
            ?"my"
            :"target",
      role:
        number===8
          ?"object"
          :hasTarget
            ?"blocker"
            :"object"
    };

    /*
      The 8-ball is always treated as the final target. Keep the
      target role unique when it is added or moved into play.
    */
    if(
      newBall.owner==="target"
    ){
      state.tableBalls.forEach(
        ball=>{
          if(
            ball.owner==="target"
          ){
            ball.owner="my";
            ball.role="blocker";
          }
        }
      );
    }

    state.tableBalls.push(
      newBall
    );

    if(
      newBall.owner==="target"
    ){
      state.object={
        x:next.x,
        y:next.y,
        number
      };
    }
  }

  solve();
  return true;
}

let dragPointerId=null;

canvas.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    const p=
      fromScreen(
        event.clientX,
        event.clientY
      );

    const hit=
      nearestBall(p);

    if(hit){

      if(
        hit.type==="cue"
      ){

        state.selectedBall=
          "cue";

        state.selectedRackBall=
          null;

        dragPointerId=
          event.pointerId;

        if(
          canvas.setPointerCapture
        ){
          canvas.setPointerCapture(
            event.pointerId
          );
        }

        render();

        return;
      }

      const ball=
        state.tableBalls.find(
          b=>
            b.number===
            hit.number
        );

      if(!ball){
        return;
      }

      state.selectedBall=
        "object";

      state.selectedRackBall=
        ball.number;

      dragPointerId=
        event.pointerId;

      if(
        canvas.setPointerCapture
      ){
        canvas.setPointerCapture(
          event.pointerId
        );
      }

      if(
        ball.owner==="target"
      ){

        state.object={
          x:ball.x,
          y:ball.y,
          number:ball.number
        };
      }

      render();

      return;
    }

    const pocket=nearestPocket(p);
    if(pocket){
      /*
        Tapping the active mouth returns the solver to its
        suggested-pocket search, so there is no second HTML
        pocket control to hunt for on small screens.
      */
      state.selectedPocket=
        state.selectedPocket&&
        state.selectedPocket.id===pocket.id
          ?null
          :pocket;
      solve();
      return;
    }

    if(
      !state.selectedBall
    ){
      return;
    }

    dragPointerId=
      event.pointerId;

    if(
      canvas.setPointerCapture
    ){
      canvas.setPointerCapture(
        event.pointerId
      );
    }

    moveSelectedBall(p);
  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "pointermove",
  event=>{
    if(
      dragPointerId===
      null||
      event.pointerId!==
      dragPointerId
    ){
      return;
    }

    event.preventDefault();

    moveSelectedBall(
      fromScreen(
        event.clientX,
        event.clientY
      )
    );
  },
  {
    passive:false
  }
);

function endPointer(event){
  if(
    event.pointerId!==
    dragPointerId
  ){
    return;
  }

  dragPointerId=null;

  if(
    canvas.releasePointerCapture
  ){
    try{
      canvas.releasePointerCapture(
        event.pointerId
      );
    }catch(error){
      /* Pointer capture may already be released. */
    }
  }
}

canvas.addEventListener(
  "pointerup",
  endPointer
);

canvas.addEventListener(
  "pointercancel",
  endPointer
);

/* ============================================================
   RESET
   ============================================================ */

document.getElementById(
  "reset"
).onclick=()=>{

  state.cue={
    x:22,
    y:34
  };

  state.object={
    x:65,
    y:20,
    number:3
  };

  state.tableBalls=[
    {
      number:3,
      x:65,
      y:20,
      role:"object",
      owner:"target"
    }
  ];

  state.selectedBall=null;

  state.selectedRackBall=3;

  state.selectedPocket=null;

  state.mode="auto";

  state.solution=null;

  state.contactBall=null;

  solve();
};

/* ============================================================
   RESIZE
   ============================================================ */

let resizeTimer=null;

window.addEventListener(
  "resize",
  ()=>{

    clearTimeout(
      resizeTimer
    );

    resizeTimer=
      setTimeout(
        ()=>{

          DPR=Math.min(
            window.devicePixelRatio||1,
            MAX_DPR
          );

          resizeCanvas();

        },
        50
      );
  }
);

function resizeCanvas(){

  const rect=
    canvas.getBoundingClientRect();

  canvas.width=
    Math.max(
      1,
      Math.round(
        rect.width*DPR
      )
    );

  canvas.height=
    Math.max(
      1,
      Math.round(
        rect.height*DPR
      )
    );

  draw();
}

/* ============================================================
   START
   ============================================================ */

requestAnimationFrame(
  ()=>{

    state.tableBalls=[
      {
        number:3,
        x:65,
        y:20,
        role:"object",
        owner:"target"
      }
    ];

    state.selectedRackBall=3;

    resizeCanvas();

    solve();
  }
);

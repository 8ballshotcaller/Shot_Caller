<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a0c">
<title>Shot Caller</title>

<style>
:root{
  --bg:#070a0c;
  --panel:#11171a;
  --panel2:#0b1013;
  --line:rgba(255,255,255,.075);
  --text:#f5f7f8;
  --muted:#89949b;
  --lime:#d9ff3f;
  --red:#ff4652;
  --green:#42d995;
  --cyan:#45d9ff;
  --bank:#ff9f43;
  --white:#f5f7f8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% -10%,
      #26343a 0,
      #11191d 35%,
      #07090b 78%
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  padding:7px;
}

button{
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:min(1200px,100%);
  margin:auto;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-name{
  font-size:24px;
  font-weight:900;
  letter-spacing:.015em;
  line-height:1;
}

.reset{
  border:1px solid var(--line);
  background:#141a1e;
  color:#e9edef;
  border-radius:9px;
  min-width:54px;
  min-height:30px;
  padding:5px 12px;
  font-size:10px;
  font-weight:850;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(330px,.72fr);
  gap:9px;
}

.card{
  background:rgba(17,23,26,.98);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}

.table-card{
  padding:9px;
  min-width:0;
}

.table-stage{
  width:100%;
  aspect-ratio:2/1;
  position:relative;
}

#table{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.side{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.full-card{
  width:100%;
}

.section{
  padding:13px 14px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:23px;
  gap:10px;
}

.section-title{
  font-size:13px;
  font-weight:950;
  letter-spacing:-.02em;
}

.section-accent{
  color:var(--lime);
  font-size:10px;
  font-weight:950;
  letter-spacing:.01em;
}

.section-action{
  appearance:none;
  -webkit-appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  min-height:30px;
  padding:5px 12px;
  border:1px solid rgba(255,255,255,.18);
  background:#171e22;
  color:#dce3e6;
  border-radius:8px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 1px 2px rgba(0,0,0,.3);
  font-size:10px;
  font-weight:950;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.section-action:hover{
  background:#222b30;
  border-color:rgba(255,255,255,.28);
}

.section-action:active{
  transform:translateY(1px);
}

.section-action.active{
  background:var(--lime);
  border-color:var(--lime);
  color:#10150b;
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}

.section-action:disabled{
  opacity:.38;
  cursor:not-allowed;
  background:#11171a;
  border-color:rgba(255,255,255,.10);
  color:#7d888e;
  box-shadow:none;
}

.section-action:disabled:hover{
  background:#11171a;
  border-color:rgba(255,255,255,.10);
}

.where-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}

.where-grid.combo{
  grid-template-columns:repeat(3,1fr);
}

.ball-panel{
  background:#0a0e10;
  border:1px solid rgba(255,255,255,.055);
  border-radius:11px;
  padding:8px;
  min-width:0;
}

.ball-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.ball-label{
  color:#aeb7bd;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}

.ball-view{
  width:100%;
  aspect-ratio:1;
  display:block;
}

.combo-only{
  display:none;
}

.where-grid.combo .combo-only{
  display:block;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:9px;
}

.stat{
  min-width:0;
  background:#0b1013;
  border:1px solid rgba(255,255,255,.055);
  border-radius:9px;
  padding:9px;
}

.stat-label{
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
}

.stat-value{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pro-instruction{
  margin-top:9px;
  padding:9px 11px;
  border-left:3px solid var(--lime);
  background:#0b1013;
  border-radius:0 9px 9px 0;
  color:#e3e8ea;
  font-size:11px;
  line-height:1.25;
  font-weight:800;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.call-line{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.call-step{
  flex:0 0 auto;
  min-width:48px;
  font-size:9px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#7d888e;
  font-weight:900;
}

.call-text{
  flex:1;
}

.pro-instruction .highlight{
  color:#f5f7f8;
  font-weight:950;
}

.pro-instruction .neutral-emphasis{
  color:#ffffff;
  font-weight:900;
}


.pockets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.pocket{
  min-height:38px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.08);
  background:#101519;
  color:#b8c1c6;
  font-size:10px;
  font-weight:850;
}

.pocket.selected{
  background:rgba(217,255,63,.10);
  border-color:var(--lime);
  color:var(--lime);
}

.shot-type-section{
  border-top:1px solid rgba(255,255,255,.055);
  margin-top:14px;
  padding-top:13px;
}

.modes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-top:9px;
}

.mode{
  flex:0 0 calc(33.333% - 4px);
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:38px;
  padding:8px 4px;
  font-size:10px;
  font-weight:900;
}


.mode.active{
  background:var(--lime);
  color:#10150b;
  border-color:var(--lime);
}

.mode.suggested:not(.active){
  color:var(--lime);
  border-color:rgba(217,255,63,.46);
  background:rgba(217,255,63,.06);
}

.rack{
  position:relative;
  margin:11px auto 3px;
  width:min(230px,78vw);
  aspect-ratio:1.58/1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rack-row{
  display:flex;
  gap:3px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.rack-row.r1{top:1%}
.rack-row.r2{top:17%}
.rack-row.r3{top:33%}
.rack-row.r4{top:49%}
.rack-row.r5{top:65%}

.rack-ball{
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  position:relative;
  display:grid;
  place-items:center;
  padding:0;
  overflow:hidden;
  box-shadow:
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
  font-size:9px;
  font-weight:950;
  color:#111;
}

.rack-ball.stripe{
  background:
    linear-gradient(
      to bottom,
      var(--ball-color) 0 30%,
      #f4f4f4 30% 70%,
      var(--ball-color) 70% 100%
    );
}

.rack-ball.solid{
  background:var(--ball-color);
}

.rack-ball span{
  width:14px;
  height:14px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-size:7px;
  font-weight:950;
  border:1px solid rgba(0,0,0,.25);
}

.rack-ball.selected{
  outline:3px solid var(--lime);
  outline-offset:2px;
  z-index:2;
}

.rack-ball.on-table{
  opacity:.42;
}

.rack-ball.object-ball{
  opacity:1;
}

.rack-ball.my-ball{
  box-shadow:
    0 0 0 2px rgba(69,217,255,.65),
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
}

.rack-ball.opponent-ball{
  box-shadow:
    0 0 0 2px rgba(255,159,67,.65),
    inset -3px -4px 5px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.25);
}

.ownership-section{
  border-top:1px solid rgba(255,255,255,.055);
  margin-top:14px;
  padding-top:13px;
}

.ownership-label{
  color:#89949b;
  font-size:9px;
  font-weight:900;
  letter-spacing:.07em;
  margin-top:9px;
  margin-bottom:7px;
}

.ownership-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.ownership-button{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid rgba(255,255,255,.09);
  background:#101519;
  color:#b8c1c6;
  border-radius:9px;
  min-height:40px;
  padding:8px 5px;
  font-size:10px;
  font-weight:900;
  text-align:center;
  transition:
    background .12s ease,
    border-color .12s ease,
    color .12s ease,
    transform .08s ease,
    box-shadow .12s ease;
}

.ownership-button:hover{
  background:#182024;
  border-color:rgba(255,255,255,.2);
}

.ownership-button:active{
  transform:translateY(1px);
}

.ownership-button.active{
  background:var(--lime);
  color:#10150b;
  border-color:var(--lime);
  box-shadow:
    0 0 0 1px rgba(217,255,63,.15),
    0 2px 7px rgba(217,255,63,.12);
}

.ownership-help{
  margin-top:7px;
  color:#667178;
  font-size:9px;
  line-height:1.45;
  font-weight:700;
}

@media(max-width:850px){
  .layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  body{
    padding:5px;
  }

  .header{
    height:45px;
  }

  .brand-name{
    font-size:20px;
  }

  .section{
    padding:12px;
  }

  .where-grid{
    gap:5px;
  }

  .controls{
    grid-template-columns:repeat(2,1fr);
  }

  .rack-ball{
    width:27px;
    height:27px;
  }

  .section-action{
    min-width:58px;
    min-height:32px;
  }

  .ball-label{
    font-size:8px;
  }

  .modes{
    grid-template-columns:repeat(2,1fr);
  }

  .ownership-buttons{
    grid-template-columns:1fr;
  }
}
</style>
<style>
  /* Shot Caller revision polish: keep every control in the side rail. */
  .header { padding: 0 2px; }
  .brand { gap: 12px; }
  .brand-name {
    letter-spacing: .09em;
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .brand-name::first-letter { color: inherit; }
  .reset, #deleteBall {

    font-size: 10px;

    letter-spacing: .08em;
  }
  .ownership-help { display: grid; gap: 4px; }
  .ownership-section.eight-ball-auto .ownership-label,

  }

    margin-top: 8px;
  }
  @media (max-width: 520px) {

  }
</style>
<style>
      /* Focused product identity: a cue-ball mark and a two-beat wordmark. */
      .brand { gap: 10px; }
      .brand-mark {
        width: 30px;
        height: 30px;
        position: relative;
        display: grid;
        place-items: center;
        border: 1px solid rgba(217,255,63,.72);
        border-radius: 50%;
        background: radial-gradient(circle at 32% 27%, #f9fbfb 0 11%, #d2d8da 18%, #536269 64%, #151b1e 100%);
        box-shadow: inset -3px -4px 5px rgba(0,0,0,.34), 0 0 0 3px rgba(217,255,63,.08);
        transform: rotate(-9deg);
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: -5px;
        border: 1px solid rgba(217,255,63,.20);
        border-left-color: transparent;
        border-bottom-color: transparent;
        border-radius: 50%;
        transform: rotate(28deg);
      }
      .mark-eight {
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #101518;
        color: #eef4f1;
        font-size: 10px;
        line-height: 1;
        font-weight: 950;
        transform: rotate(9deg);
      }
      .mark-ring { display: none; }
      .brand-name {
        display: flex;
        align-items: baseline;
         gap: 5px;
         font-family: inherit;
        font-size: 24px;
         font-weight: 850;
         letter-spacing: .015em;
        text-transform: none;
      }
       .brand-name span:last-child {
         color: inherit;
         font-style: normal;
       }
       .inline-eight {
         width: .78em;
         height: .78em;
         margin: 0 .06em;
         display: inline-grid;
         place-items: center;
         vertical-align: .02em;
         border: 1px solid rgba(217,255,63,.75);
         border-radius: 50%;
         background: radial-gradient(circle at 32% 25%, #fafcfc 0 10%, #ccd3d5 22%, #47565c 72%, #121719 100%);
         color: #f5f7f8;
         font-family: inherit;
         font-size: .54em;
         font-weight: 900;
         line-height: 1;
         text-align: center;
         box-shadow: inset -1px -2px 2px rgba(0,0,0,.35);
      }
      .pro-instruction {
        border-left-width: 4px;
        padding: 10px 12px 10px 13px;
        background: linear-gradient(90deg, rgba(217,255,63,.075), #0b1013 42%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
      }
      .call-step { color: var(--lime); }
      @media (max-width: 520px) {
        .brand-mark { width: 27px; height: 27px; }
      .brand-name { font-size: 20px; gap: 4px; }
      }
    </style>
  </head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><span class="mark-eight">8</span><span class="mark-ring"></span></div>
      <div class="brand-name"><span>Sh<span class="inline-eight">8</span>t</span><span>Caller</span></div>
  </div>

  <button class="reset" id="reset">
    Reset
  </button>
</header>

<main class="layout">

<section class="card table-card">

  <div class="table-stage">
    <canvas id="table"></canvas>
  </div>

</section>

<aside class="side">

<section class="card full-card section">

  <div class="section-head">
    <div class="section-title">
      The Call
    </div>

    <div class="section-accent">
      Ball <span id="whereBall">—</span>
    </div>
  </div>

  <div class="where-grid" id="whereGrid">

    <div class="ball-panel">
      <div class="ball-head">
        <div class="ball-label" id="cueViewLabel">
          Cue Ball
        </div>
      </div>

      <canvas class="ball-view" id="cueView"></canvas>
    </div>

    <div class="ball-panel">
      <div class="ball-head">
        <div class="ball-label" id="objectViewLabel">
          Object Ball
        </div>
      </div>

      <canvas class="ball-view" id="objectView"></canvas>
    </div>

    <div class="ball-panel combo-only">
      <div class="ball-head">
        <div class="ball-label" id="targetViewLabel">
          Target Ball
        </div>
      </div>

      <canvas class="ball-view" id="targetView"></canvas>
    </div>

  </div>

  <div class="controls">

    <div class="stat">
      <div class="stat-label">
        Type
      </div>
      <div class="stat-value" id="shotType">
        —
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Pocket
      </div>
      <div class="stat-value" id="shotPocket">
        —
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Rail
      </div>
      <div class="stat-value" id="shotRail">
        —
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Speed
      </div>
      <div class="stat-value" id="shotSpeed">
        —
      </div>
    </div>

  </div>

  <div class="pro-instruction" id="instruction">
    Place the cue ball and target ball.
  </div>

</section>

<section class="card full-card section">

  <div class="section-head">
    <div class="section-title">
      Shot Type
    </div>

  </div>

  <div class="modes">

    <button class="mode" data-mode="straight">
      Straight
    </button>

    <button class="mode" data-mode="cut">
      Cut
    </button>

    <button class="mode" data-mode="combo">
      Combo
    </button>

    <button class="mode suggested" data-mode="auto">
      Suggested
    </button>

    <button class="mode" data-mode="bank">
      Bank
    </button>

    <button class="mode" data-mode="kick">
      Kick
    </button>

  </div>

</section>

<section class="card full-card section">

  <div class="section-head">
    <div class="section-title">
      Balls In Play
    </div>

    <div class="section-accent" id="rackAccent">
      Select
    </div>

    <button class="section-action" id="deleteBall" disabled>
      Remove
    </button>
  </div>

  <div class="rack" id="rack"></div>

  <div class="ownership-section">

    <div class="section-head">

      <div class="section-title">
        Ball Role
      </div>

    </div>

    <div class="ownership-label">
      Assign the selected ball
    </div>

    <div class="ownership-buttons" id="ownershipButtons">

      <button
        type="button"
        class="ownership-button"
        data-owner="target"
      >
        Target Ball
      </button>

      <button
        type="button"
        class="ownership-button"
        data-owner="my"
      >
        Player's Ball
      </button>

      <button
        type="button"
        class="ownership-button"
        data-owner="opponent"
      >
        Opponent's Ball
      </button>

    </div>

    <div class="ownership-help">
      <div>A player's ball can be used to hit a combo.</div>
      <div>Opponent's balls are blockers only.</div>
    </div>

  </div>

</section>

</aside>

</main>
</div>

<script>
"use strict";

/* ============================================================
   PHYSICAL TABLE
   ============================================================ */

const TABLE_W=100;
const TABLE_H=50;

const BALL_DIAMETER=2.25;
const BALL_RADIUS=BALL_DIAMETER/2;

const RAIL={
  top:BALL_RADIUS,
  bottom:TABLE_H-BALL_RADIUS,
  left:BALL_RADIUS,
  right:TABLE_W-BALL_RADIUS
};

const POCKET_SIZE=4.55;

const POCKETS=[
  {
    id:"TL",
    name:"Top Left Corner",
    x:0,
    y:0,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"TM",
    name:"Top Side",
    x:50,
    y:0,
    type:"side",
    opening:POCKET_SIZE
  },
  {
    id:"TR",
    name:"Top Right Corner",
    x:100,
    y:0,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"BL",
    name:"Bottom Left Corner",
    x:0,
    y:50,
    type:"corner",
    opening:POCKET_SIZE
  },
  {
    id:"BM",
    name:"Bottom Side",
    x:50,
    y:50,
    type:"side",
    opening:POCKET_SIZE
  },
  {
    id:"BR",
    name:"Bottom Right Corner",
    x:100,
    y:50,
    type:"corner",
    opening:POCKET_SIZE
  }
];

/* ============================================================
   BALL SET
   ============================================================ */

const BALLS=[
  {n:1,type:"solid",color:"#f4c51d"},
  {n:2,type:"solid",color:"#2867c7"},

/* ============================================================
   STATE
   ============================================================ */

const state={
  cue:{
    x:22,
    y:34
  },

  object:{
    x:65,
    y:20,
    number:3
  },

  tableBalls:[
    {

      role:"object",

    }
  ],

/* ============================================================
   DOM
   ============================================================ */

const canvas=document.getElementById("table");
const ctx=canvas.getContext("2d");

const MAX_DPR=3;

let DPR=Math.min(
  window.devicePixelRatio||1,
  MAX_DPR
);

/* ============================================================
   VECTOR MATH
   ============================================================ */

function V(x,y){
  return{x,y};
}

function add(a,b){
  return V(
    a.x+b.x,
    a.y+b.y
  );
}

function sub(a,b){
  return V(
    a.x-b.x,
    a.y-b.y
  );
}

function mul(a,n){
  return V(
    a.x*n,
    a.y*n
  );
}

function dot(a,b){
  return a.x*b.x+a.y*b.y;
}

function len(a){
  return Math.hypot(
    a.x,
    a.y
  );
}

function norm(a){
  const l=len(a);

  if(l<1e-10){
    return V(0,0);
  }

  return V(
    a.x/l,
    a.y/l
  );
}

function dist(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function clamp(n,a,b){
  return Math.max(
    a,
    Math.min(b,n)
  );
}

/* ============================================================
   GEOMETRY
   ============================================================ */

function centerInside(p){
  return(
    p.x>=BALL_RADIUS &&
    p.x<=TABLE_W-BALL_RADIUS &&
    p.y>=BALL_RADIUS &&
    p.y<=TABLE_H-BALL_RADIUS
  );
}

function pointSegmentDistance(
  p,
  a,
  b
){

  const ab=sub(b,a);

  const d=dot(
    ab,
    ab
  );

  if(d<1e-10){
    return dist(p,a);
  }

  const t=clamp(
    dot(
      sub(p,a),
      ab
    )/d,
    0,
    1
  );

  return dist(
    p,
    add(
      a,
      mul(ab,t)
    )
  );
}

/*
  A moving ball center must stay at least one full ball
  diameter away from the center of every unrelated ball.
*/
function pathClear(
  a,
  b,
  ignoreNumbers=[]
){

  if(!Array.isArray(ignoreNumbers)){
    ignoreNumbers=[ignoreNumbers];
  }

  if(dist(a,b)<.01){
    return false;
  }

  for(const ball of state.tableBalls){

    if(
      ignoreNumbers.includes(ball.number)
    ){
      continue;
    }

    if(
      pointSegmentDistance(
        ball,
        a,
        b
      )<
      BALL_DIAMETER*1.015
    ){
      return false;
    }
  }

  return true;
}

function clearToBall(
  start,
  target,
  ignored=[]
){
  return pathClear(
    start,
    target,
    ignored
  );
}

/* ============================================================
   PHYSICAL CUE APPROACH
   ============================================================ */

function validCueApproach(
  cue,
  ghost,
  object
){

  const cueTravel=
    norm(
      sub(
        ghost,
        cue
      )
    );

  const objectTravel=
    norm(
      sub(
        object,
        ghost
      )
    );

  if(
    len(cueTravel)<.01||
    len(objectTravel)<.01
  ){
    return false;
  }

  return(
    dot(
      cueTravel,
      objectTravel
    )>=.22
  );
}

function cutAngleDegrees(
  cue,
  ghost,
  object
){

  const cueTravel=
    norm(
      sub(
        ghost,
        cue
      )
    );

  const objectTravel=
    norm(
      sub(
        object,
        ghost
      )
    );

  return(
    Math.acos(
      clamp(
        dot(
          cueTravel,
          objectTravel
        ),
        -1,
        1
      )
    )*
    180/
    Math.PI
  );
}

/* ============================================================
   POCKET TARGETS
   ============================================================ */

function pocketTargets(pocket){

  const targets=[];

  if(
    pocket.type==="side"
  ){

    /*
      Use the actual pocket opening as the aim reference. These
      small samples model the usable mouth without moving the
      target onto an arbitrary point on the cloth.
    */
    [-1.20,-.60,0,.60,1.20]
      .forEach(offset=>{

        targets.push(
          V(
            pocket.x+offset,
            pocket.y
          )
        );

      });

  }else{

    const sx=
      pocket.x===0
        ?1
        :-1;

    const sy=
      pocket.y===0
        ?1
        :-1;

    [
      0,
      .70,
      1.40
    ].forEach(inset=>{

      targets.push(
        V(
          pocket.x+sx*inset,
          pocket.y+sy*inset
        )
      );

    });

  }

  return targets;
}

/* ============================================================
   POCKET APPROACH QUALITY

   A ball must arrive into the jaws of a pocket within the
   pocket's usable acceptance angle. Corner pockets face the
   table diagonally and are forgiving. Side pockets face
   straight out of the rail and are extremely unforgiving:
   anything much past 40 degrees off the pocket face simply
   rattles or hits the near jaw.

   Returning null means the pocket cannot physically accept
   that arrival line.
   ============================================================ */

function pocketFacing(pocket){

  if(pocket.type==="side"){
    return V(
      0,
      pocket.y===0
        ?-1
        :1
    );
  }

  const sx=
    pocket.x===0
      ?-1
      :1;

  const sy=
    pocket.y===0
      ?-1
      :1;

  return norm(
    V(
      sx,
      sy
    )
  );
}

function pocketApproachDegrees(
  pocket,
  arrivalDirection
){

  const facing=
    pocketFacing(pocket);

  return(
    Math.acos(
      clamp(
        dot(
          norm(arrivalDirection),
          facing
        ),
        -1,
        1
      )
    )*
    180/
    Math.PI
  );
}

function pocketApproachPenalty(
  pocket,
  arrivalDirection
){

  const deg=
    pocketApproachDegrees(
      pocket,
      arrivalDirection
    );

  if(!Number.isFinite(deg)){
    return null;
  }

  if(pocket.type==="side"){

    if(deg>42){
      return null;
    }

    return Math.pow(
      Math.max(0,deg-12),
      1.7
    )*.42;
  }

  if(deg>74){
    return null;
  }

  return Math.pow(
    Math.max(0,deg-32),
    1.5
  )*.14;
}


/* ============================================================
   GHOST BALL
   ============================================================ */

function ghostForDirection(
  object,
  direction
){

  return sub(
    object,
    mul(
      norm(direction),
      BALL_DIAMETER
    )
  );
}

/*
  Direction from the actual ball center to the actual contact
  point on that ball.

  This is the same direction used by the enlarged ball view.
*/
function contactDirection(
  ballCenter,
  contactPoint
){

  if(
    !ballCenter||
    !contactPoint
  ){
    return V(0,0);
  }

  return norm(
    sub(
      contactPoint,
      ballCenter
    )
  );
}

/* ============================================================
   DIRECT SHOT
   ============================================================ */

function directCandidate(
  cue,
  object,
  pocket,
  target
){

  const objectVector=
    sub(
      target,
      object
    );

  if(
    len(objectVector)<.01
  ){
    return null;
  }

  const objectDirection=
    norm(objectVector);

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  if(
    !validCueApproach(
      cue,
      ghost,
      object
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      cue,
      ghost,
      [object.number]
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      object,
      target,
      [object.number]
    )
  ){
    return null;
  }

  const cutDegrees=
    cutAngleDegrees(
      cue,
      ghost,
      object
    );

  if(
    !Number.isFinite(cutDegrees)||
    cutDegrees>78
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      ghost
    );

  const objectDistance=
    dist(
      object,
      target
    );

  const objectContactPoint=
    sub(
      object,
      mul(
        objectDirection,
        BALL_RADIUS
      )
    );

  const isStraight=
    cutDegrees<=12;

  const cutPenalty=
    Math.pow(
      Math.max(
        0,
        cutDegrees-12
      ),
      1.7
    )*.30;

  /*
    The ball must actually be able to enter the pocket from
    this angle. This is what stops the solver from calling a
    razor cut into a side pocket when a natural corner exists.
  */
  const approachPenalty=
    pocketApproachPenalty(
      pocket,
      objectDirection
    );

  if(approachPenalty===null){
    return null;
  }


  return{
    kind:isStraight
      ?"straight"
      :"cut",

    pocket,
    target,
    rail:null,

    ghost,
    objectContactPoint,

    bankPoint:null,

    cueDirection:
      norm(
        sub(
          ghost,
          cue
        )
      ),

    objectDirection,

    cueDistance,
    objectDistance,

    cutDegrees,

    approachDegrees:
      pocketApproachDegrees(
        pocket,
        objectDirection
      ),

    score:
      cueDistance+
      objectDistance+
      cutPenalty+
      approachPenalty
  };

}

/* ============================================================
   COMBINATION SHOT
   ============================================================ */

function combinationCandidate(
  cue,
  firstBall,
  secondBall,
  pocket,
  pocketTarget
){

  if(
    !firstBall||
    !secondBall||
    firstBall.number===
    secondBall.number
  ){
    return null;
  }

  /*
    HARD COMBO RULE:

    The first ball struck must be the player's ball.
    Opponent balls are NEVER eligible as combo balls.
  */
  if(
    firstBall.owner!=="my"
  ){
    return null;
  }

  if(
    secondBall.owner!=="target"
  ){
    return null;
  }

  const secondToPocketVector=
    sub(
      pocketTarget,
      secondBall
    );

  if(
    len(secondToPocketVector)<.01
  ){
    return null;
  }

  const secondToPocket=
    norm(secondToPocketVector);

  /*
    The first ball must strike the target ball on the side
    opposite the target ball's travel to the pocket.
  */
  const secondBallContactPoint=
    sub(
      secondBall,
      mul(
        secondToPocket,
        BALL_DIAMETER
      )
    );

  if(
    !centerInside(
      secondBallContactPoint
    )
  ){
    return null;
  }

  /*
    The combination ball must be on the pocket-opposite side
    of the target. Without this check, a line that passes through
    the target could be accepted even though the first ball is
    approaching from the pocket side.
  */
  const firstSideDistance=
    dot(
      sub(
        firstBall,
        secondBall
      ),
      mul(
        secondToPocket,
        -1
      )
    );

  if(
    firstSideDistance<
    BALL_RADIUS*.8
  ){
    return null;
  }

  const firstToSecondVector=
    sub(
      secondBallContactPoint,
      firstBall
    );

  if(
    len(firstToSecondVector)<.01
  ){
    return null;
  }

  const firstToSecond=
    norm(firstToSecondVector);

  /*
    Keep physical surface contacts separate from the center-to-
    center ghost positions drawn on the table.
  */
  const firstBallContactPoint=
    sub(
      firstBall,
      mul(
        firstToSecond,
        BALL_RADIUS
      )
    );

  const targetBallContactPoint=
    sub(
      secondBall,
      mul(
        secondToPocket,
        BALL_RADIUS
      )
    );

  /*
    Cue-ball ghost position for contacting the player's ball.
  */
  const cueGhost=
    ghostForDirection(
      firstBall,
      firstToSecond
    );

  if(
    !centerInside(cueGhost)
  ){
    return null;
  }

  /*
    Cue path must be clear of every other ball.
  */
  if(
    !clearToBall(
      cue,
      cueGhost,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  if(
    !validCueApproach(
      cue,
      cueGhost,
      firstBall
    )
  ){
    return null;
  }

  /*
    Player's ball must have a clean line into the target.
  */
  if(
    !clearToBall(
      firstBall,
      secondBallContactPoint,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  /*
    Target ball must then have a clean line to the pocket.
  */
  if(
    !clearToBall(
      secondBall,
      pocketTarget,
      [
        firstBall.number,
        secondBall.number
      ]
    )
  ){
    return null;
  }

  const cueDirection=
    norm(
      sub(
        cueGhost,
        cue
      )
    );

  const firstIncoming=
    norm(
      sub(
        firstBall,
        cueGhost
      )
    );

  const firstOutgoing=
    norm(
      sub(
        secondBallContactPoint,
        firstBall
      )
    );

  const transferAngle=
    Math.acos(
      clamp(
        dot(
          firstIncoming,
          firstOutgoing
        ),
        -1,
        1
      )
    )*
    180/
    Math.PI;

  /*
    Reject physically extreme combinations.
  */
  if(
    !Number.isFinite(transferAngle)||
    transferAngle>68
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      cueGhost
    );

  const firstDistance=
    dist(
      firstBall,
      secondBallContactPoint
    );

  const secondDistance=
    dist(
      secondBall,
      pocketTarget
    );

  /*
    The second ball still has to arrive into a pocket it can
    physically accept.
  */
  const comboApproachPenalty=
    pocketApproachPenalty(
      pocket,
      secondToPocket
    );

  if(comboApproachPenalty===null){
    return null;
  }

  /*
    Combo penalty is significant so a random combo does not
    replace a clearly superior normal shot. However, clean
    combinations remain valid and selectable as a shot type.
  */
  const score=
    cueDistance+
    firstDistance+
    secondDistance+
    18+
    comboApproachPenalty+
    Math.max(
      0,
      transferAngle-30
    )*1.4;


  return{
    kind:"combination",

    pocket,
    target:pocketTarget,

    combinationBall:firstBall,
    targetBall:secondBall,

    firstContactPoint:cueGhost,
    firstBallContactPoint,

    secondContactPoint:
      secondBallContactPoint,
    targetBallContactPoint,

    contactBall:firstBall,

    ghost:cueGhost,

    combinationGhost:
      secondBallContactPoint,

    rail:null,
    bankPoint:null,

    cueDirection,

    objectDirection:firstOutgoing,

    cueDistance,

    objectDistance:
      firstDistance+
      secondDistance,

    combinationDistance:
      firstDistance,

    targetDistance:
      secondDistance,

    transferAngle,

    cutDegrees:0,

    score
  };
}

/* ============================================================
   RAIL REFLECTION
   ============================================================ */

function reflectAcrossRail(
  p,
  rail
){

  if(
    rail==="top"
  ){
    return V(
      p.x,
      2*RAIL.top-p.y
    );
  }

  if(
    rail==="bottom"
  ){
    return V(
      p.x,
      2*RAIL.bottom-p.y
    );
  }

  if(
    rail==="left"
  ){
    return V(
      2*RAIL.left-p.x,
      p.y
    );
  }

  if(
    rail==="right"
  ){
    return V(
      2*RAIL.right-p.x,
      p.y
    );
  }

  return null;
}

function railIntersection(
  a,
  b,
  rail
){

  const dx=
    b.x-a.x;

  const dy=
    b.y-a.y;

  let t;

  if(
    rail==="top"||
    rail==="bottom"
  ){

    const y=
      rail==="top"
        ?RAIL.top
        :RAIL.bottom;

    if(
      Math.abs(dy)<1e-10
    ){
      return null;
    }

    t=
      (y-a.y)/dy;

  }else{

    const x=
      rail==="left"
        ?RAIL.left
        :RAIL.right;

    if(
      Math.abs(dx)<1e-10
    ){
      return null;
    }

    t=
      (x-a.x)/dx;
  }

  if(
    t<=.00001||
    t>=.99999
  ){
    return null;
  }

  return V(
    a.x+dx*t,
    a.y+dy*t
  );
}

function usableRailPoint(
  p,
  rail
){

  const margin=1.5;

  if(
    rail==="top"||
    rail==="bottom"
  ){
    return(
      p.x>
        BALL_RADIUS+margin&&
      p.x<
        TABLE_W-BALL_RADIUS-margin
    );
  }

  return(
    p.y>
      BALL_RADIUS+margin&&
    p.y<
      TABLE_H-BALL_RADIUS-margin
  );
}

/* ============================================================
   ONE-RAIL BANK
   ============================================================ */

function bankCandidate(
  cue,
  object,
  pocket,
  target,
  rail
){

  if(
    rail==="top"&&
    pocket.y===0
  ){
    return null;
  }

  if(
    rail==="bottom"&&
    pocket.y===TABLE_H
  ){
    return null;
  }

  if(
    rail==="left"&&
    pocket.x===0
  ){
    return null;
  }

  if(
    rail==="right"&&
    pocket.x===TABLE_W
  ){
    return null;
  }

  const reflected=
    reflectAcrossRail(
      target,
      rail
    );

  if(!reflected){
    return null;
  }

  const bankPoint=
    railIntersection(
      object,
      reflected,
      rail
    );

  if(
    !bankPoint||
    !usableRailPoint(
      bankPoint,
      rail
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      object,
      bankPoint,
      [object.number]
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      bankPoint,
      target,
      [object.number]
    )
  ){
    return null;
  }

  const objectDirection=
    norm(
      sub(
        bankPoint,
        object
      )
    );

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  if(
    !validCueApproach(
      cue,
      ghost,
      object
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      cue,
      ghost,
      [object.number]
    )
  ){
    return null;
  }

  const cueDirection=
    norm(
      sub(
        ghost,
        cue
      )
    );

  const objectContactPoint=
    sub(
      object,
      mul(
        objectDirection,
        BALL_RADIUS
      )
    );

  const incoming=
    norm(
      sub(
        object,
        ghost
      )
    );

  const cutDegrees=
    Math.acos(
      clamp(
        dot(
          cueDirection,
          incoming
        ),
        -1,
        1
      )
    )*
    180/
    Math.PI;

  if(
    !Number.isFinite(cutDegrees)||
    cutDegrees>75
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      ghost
    );

  const firstLeg=
    dist(
      object,
      bankPoint
    );

  const secondLeg=
    dist(
      bankPoint,
      target
    );

  const approachPenalty=
    pocketApproachPenalty(
      pocket,
      norm(
        sub(
          target,
          bankPoint
        )
      )
    );

  if(approachPenalty===null){
    return null;
  }

  return{
    kind:"bank",

    pocket,
    target,
    rail,

    ghost,
    objectContactPoint,
    bankPoint,

    cueDirection,
    objectDirection,

    cueDistance,

    objectDistance:
      firstLeg+
      secondLeg,

    bankDistance:firstLeg,

    postBankDistance:
      secondLeg,

    cutDegrees,

    score:
      cueDistance+
      firstLeg+
      secondLeg+
      25+
      approachPenalty+
      Math.max(
        0,
        cutDegrees-40
      )*1.6
  };
}

/* ============================================================
   KICK
   ============================================================ */

function kickCandidate(
  cue,
  object,
  pocket,
  rail
){

  const objectDirection=
    norm(
      sub(
        pocket,
        object
      )
    );

  if(
    len(objectDirection)<.01
  ){
    return null;
  }

  const ghost=
    ghostForDirection(
      object,
      objectDirection
    );

  if(
    !centerInside(ghost)
  ){
    return null;
  }

  const reflected=
    reflectAcrossRail(
      ghost,
      rail
    );

  if(!reflected){
    return null;
  }

  const kickPoint=
    railIntersection(
      cue,
      reflected,
      rail
    );

  if(
    !kickPoint||
    !usableRailPoint(
      kickPoint,
      rail
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      cue,
      kickPoint,
      [object.number]
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      kickPoint,
      ghost,
      [object.number]
    )
  ){
    return null;
  }

  if(
    !clearToBall(
      object,
      pocket,
      [object.number]
    )
  ){
    return null;
  }

  const cueDistance=
    dist(
      cue,
      kickPoint
    );

  const secondDistance=
    dist(
      kickPoint,
      ghost
    );

  const objectDistance=
    dist(
      object,
      pocket
    );

  const objectContactPoint=
    sub(
      object,
      mul(
        objectDirection,
        BALL_RADIUS
      )
    );

  return{
    kind:"kick",

    pocket,
    target:pocket,
    rail,

    ghost,
    objectContactPoint,

    bankPoint:kickPoint,

    cueDirection:
      norm(
        sub(
          kickPoint,
          cue
        )
      ),

    objectDirection,

    cueDistance,

    objectDistance,

    kickDistance:
      cueDistance,

    postKickDistance:
      secondDistance,

    cutDegrees:0,

    score:
      cueDistance+
      secondDistance+
      objectDistance+
      38
  };
}

/* ============================================================
   CANDIDATE GENERATION
   ============================================================ */

function directCandidatesForPocket(
  pocket
){

  const candidates=[];

  for(
    const target of
    pocketTargets(pocket)
  ){

    const candidate=
      directCandidate(
        state.cue,
        state.object,
        pocket,
        target
      );

    if(candidate){
      candidates.push(candidate);
    }
  }

  return candidates;
}

function combinationCandidatesForPocket(
  pocket
){

  const candidates=[];

  /*
    IMPORTANT:

    This deliberately searches ALL balls whose owner is
    "my". It does not care whether the ball is visually called
    an object, blocker, or anything else.

    Ownership is the sole authority for combo eligibility.
  */
  const comboBalls=
    state.tableBalls.filter(
      ball=>
        ball.owner==="my"&&
        ball.number!==
        state.object.number
    );

  if(!comboBalls.length){
    return candidates;
  }

  const targetBall=
    state.tableBalls.find(
      ball=>
        ball.owner==="target"&&
        ball.number===
        state.object.number
    );

  if(!targetBall){
    return candidates;
  }

  for(
    const combinationBall of
    comboBalls
  ){

    for(
      const target of
      pocketTargets(pocket)
    ){

      const candidate=
        combinationCandidate(
          state.cue,
          combinationBall,
          targetBall,
          pocket,
          target
        );

      if(candidate){
        candidates.push(candidate);
      }
    }
  }

  return candidates;
}

function bankCandidatesForPocket(
  pocket
){

  const candidates=[];

  for(
    const target of
    pocketTargets(pocket)
  ){

    for(
      const rail of
      [
        "top",
        "bottom",
        "left",
        "right"
      ]
    ){

      const candidate=
        bankCandidate(
          state.cue,
          state.object,
          pocket,
          target,
          rail
        );

      if(candidate){
        candidates.push(candidate);
      }
    }
  }

  return candidates;
}

function kickCandidatesForPocket(
  pocket
){

  const candidates=[];

  for(
    const rail of
    [
      "top",
      "bottom",
      "left",
      "right"
    ]
  ){

    const candidate=
      kickCandidate(
        state.cue,
        state.object,
        pocket,
        rail
      );

    if(candidate){
      candidates.push(candidate);
    }
  }

  return candidates;
}

/* ============================================================
   SOLVER
   ============================================================ */

function solve(){

  /*
    Deleting the last target is a valid editing state. Keep the
    solver untouched until a real target exists instead of
    attempting geometry with a missing object ball.
  */
  if(
    !state.object||
    !state.object.number||
    !state.tableBalls.some(
      ball=>
        ball.owner==="target"&&
        ball.number===
        state.object.number
    )
  ){
    state.solution=null;
    state.contactBall=null;
    render();
    return;
  }

  /*
    In standard 8-ball, the 8 is not a legal target while any
    player's own balls remain on the table. Stop all shot types
    here so auto mode cannot suggest an automatic-loss shot.
  */
  if(
    state.object.number===8&&
    state.tableBalls.some(
      ball=>
        ball.number!==8&&
        ball.owner==="my"
    )
  ){
    state.solution=null;
    state.contactBall=null;
    render();
    return;
  }

  const pockets=
    state.selectedPocket
      ?[state.selectedPocket]
      :POCKETS;

  const direct=[];
  const combos=[];
  const banks=[];
  const kicks=[];

  for(
    const pocket of pockets
  ){

    if(
      state.mode==="auto"||
      state.mode==="straight"||
      state.mode==="cut"
    ){

      direct.push(
        ...directCandidatesForPocket(
          pocket
        )
      );
    }

    if(
      state.mode==="auto"||
      state.mode==="cut"||
      state.mode==="combo"
    ){

      combos.push(
        ...combinationCandidatesForPocket(
          pocket
        )
      );
    }

    if(
      state.mode==="auto"||
      state.mode==="bank"
    ){

      banks.push(
        ...bankCandidatesForPocket(
          pocket
        )
      );
    }

    if(
      state.mode==="auto"||
      state.mode==="kick"
    ){

      kicks.push(
        ...kickCandidatesForPocket(
          pocket
        )
      );
    }
  }

  let best=null;

  if(
    state.mode==="auto"
  ){

    direct.sort(
      (a,b)=>
        a.score-b.score
    );

    combos.sort(
      (a,b)=>
        a.score-b.score
    );

    banks.sort(
      (a,b)=>
        a.score-b.score
    );

    kicks.sort(
      (a,b)=>
        a.score-b.score
    );

    /*
      A clean, intentional player's-ball combination gets
      real priority when it is geometrically strong.

      This fixes the previous behavior where the solver would
      effectively pretend the player's ball did not exist.
    */
    if(combos.length){

      const combo=combos[0];

      const comboQuality=
        combo.transferAngle<=38;

      const hasDirect=
        direct.length>0;

      if(
        !hasDirect||
        comboQuality&&
        (
          !direct.length||
          direct[0].kind!=="straight"&&
          combo.score<=direct[0].score*1.18
        )
      ){

        best=combo;
      }
    }

    /*
      If a clearly superior direct shot exists, keep it.
    */
    if(
      !best&&
      direct.length
    ){

      best=direct[0];
    }

    /*
      If the combo exists but the direct shot was selected,
      still allow a clean combo to replace a difficult cut.
    */
    if(
      best&&
      best.kind!=="combination"&&
      combos.length
    ){

      const combo=combos[0];

      if(
        best.kind==="cut"&&
        best.cutDegrees>=42&&
        combo.transferAngle<=42&&
        combo.score<=best.score*1.12
      ){

        best=combo;
      }
    }

    if(
      !best&&
      banks.length
    ){

      best=banks[0];
    }

    if(
      !best&&
      kicks.length
    ){

      best=kicks[0];
    }

  }else if(
    state.mode==="straight"
  ){

    const straight=
      direct.filter(
        s=>s.kind==="straight"
      );

    straight.sort(
      (a,b)=>
        a.score-b.score
    );

    if(straight.length){
      best=straight[0];
    }

  }else if(
    state.mode==="cut"
  ){

    const cuts=
      direct.filter(
        s=>s.kind==="cut"
      );

    cuts.sort(
      (a,b)=>
        a.score-b.score
    );

    if(cuts.length){
      best=cuts[0];
    }else if(combos.length){
      best=combos[0];
    }

  }else if(
    state.mode==="combo"
  ){

    combos.sort(
      (a,b)=>
        a.score-b.score
    );

    if(combos.length){
      best=combos[0];
    }

  }else if(
    state.mode==="bank"
  ){

    banks.sort(
      (a,b)=>
        a.score-b.score
    );

    if(banks.length){
      best=banks[0];
    }

  }else if(
    state.mode==="kick"
  ){

    kicks.sort(
      (a,b)=>
        a.score-b.score
    );

    if(kicks.length){
      best=kicks[0];
    }
  }

  state.solution=best;

  state.contactBall=
    best&&best.contactBall
      ?best.contactBall
      :null;

  render();
}

/* ============================================================
   SPEED
   ============================================================ */

function speedForShot(s){

  if(!s){
    return"—";
  }

  if(
    s.kind==="kick"
  ){

    return s.kickDistance>42
      ?"Hard"
      :s.kickDistance>25
        ?"Medium"
        :"Soft";
  }

  if(
    s.kind==="bank"
  ){

    return s.objectDistance>55
      ?"Hard"
      :s.objectDistance>32
        ?"Medium"
        :"Soft";
  }

  if(
    s.kind==="combination"
  ){

    const total=
      s.cueDistance+
      s.objectDistance;

    return total>75
      ?"Hard"
      :total>45
        ?"Medium"
        :"Soft";
  }

  if(
    s.cutDegrees>55
  ){
    return"Medium";
  }

  if(
    s.objectDistance<18
  ){
    return"Soft";
  }

  if(
    s.objectDistance>55
  ){
    return"Hard";
  }

  return"Medium";
}

/* ============================================================
   ACCURATE CONTACT LOCATION
   ============================================================ */

/*
  The language is now derived from the EXACT vector used to
  place the red contact dot.

  That means the enlarged ball and the sentence cannot describe
  two different contact locations.
*/

function faceText(direction){

  if(
    !direction||
    len(direction)<.02
  ){
    return"dead center";
  }

  const x=direction.x;
  const y=direction.y;

  const ax=Math.abs(x);
  const ay=Math.abs(y);

  if(
    ax<.15&&
    ay<.15
  ){
    return"dead center";
  }

  const horizontal=
    ax<.15
      ?""
      :ax<.45
        ?(
            x<0
              ?"a hair left of center"
              :"a hair right of center"
          )
        :ax<.8
          ?(
              x<0
                ?"a quarter ball left of center"
                :"a quarter ball right of center"
            )
          :(
              x<0
                ?"a half ball on the left"
                :"a half ball on the right"
            );

  const vertical=
    ay<.15
      ?""
      :ay<.45
        ?(
            y<0
              ?"a hair above center"
              :"a hair below center"
          )
        :(
            y<0
              ?"high on the ball"
              :"low on the ball"
          );

  if(
    horizontal&&
    vertical
  ){
    return horizontal+" and "+vertical;
  }

  return horizontal||vertical;
}

function cueContactDirection(s){

  if(!s){
    return V(0,0);
  }

  const contact=
    s.kind==="combination"
      ?s.firstContactPoint
      :s.ghost;

  return contactDirection(
    state.cue,
    contact
  );
}

function objectContactDirection(s){

  if(!s){
    return V(0,0);
  }

  if(
    s.kind==="combination"
  ){

    return contactDirection(
      s.combinationBall,
      s.firstBallContactPoint||
      s.firstContactPoint
    );
  }

  if(
    s.kind==="straight"
  ){
    return V(0,0);
  }

  return contactDirection(
    state.object,
    s.objectContactPoint||
    s.ghost
  );
}

function targetContactDirection(s){

  if(
    !s||
    s.kind!=="combination"
  ){
    return V(0,0);
  }

  return contactDirection(
    s.targetBall,
    s.targetBallContactPoint||
    s.secondContactPoint
  );
}

/* ============================================================
   THE SHOT CALL

   ONE source of truth for both the sentence and the three
   enlarged balls.

   Cue ball view   = TIP PLACEMENT (spin / English) ONLY.
   Object / target = CONTACT POINT ONLY.

   These are two different quantities and are never mixed.
   ============================================================ */

function tipCall(s){

  /*
    A pro hits center ball unless the shot genuinely needs
    something else.

    Banks and kicks are solved here with mirror geometry, and
    English changes the rebound angle off the rail. Recommending
    English while drawing a mirror-angle route would be a lie,
    so rail-first shots are called center ball.

    Combinations are called center ball as well: sidespin adds
    throw at the first contact and throw compounds through the
    second ball.
  */

  if(!s){
    return{
      vector:V(0,0),
      text:"Center ball"
    };
  }

  /*
    Rail routes are solved with mirror geometry. Calling side
    English there without changing the rebound calculation would
    make the written call disagree with the drawn path, so those
    shots stay at center ball.
  */
  if(
    s.kind==="bank"||
    s.kind==="kick"||
    s.kind==="combination"
  ){
    return{
      vector:V(0,0),
      text:"Center ball, no English"
    };
  }

  const cut=
    s.cutDegrees||0;

  const cueDistance=
    s.cueDistance||0;

  const objectDistance=
    s.objectDistance||0;

  if(
    s.kind==="straight"||
    cut<=12
  ){
    const vector=
      V(
        0,
        cueDistance>32
          ?-.5
          :objectDistance<18
            ?.28
            :0
      );

    return{
      vector,
      text:shortSpinText(vector)
    };
  }

  /*
    The signed turn keeps the English direction tied to the
    actual cue-to-ghost and object-to-pocket vectors. Positive
    x is the player's right side of the cue ball; negative x is
    the player's left side. This avoids reversing English when
    the shot is mirrored across the table.
  */
  const signedTurn=
    s.cueDirection.x*s.objectDirection.y-
    s.cueDirection.y*s.objectDirection.x;

  const sideMagnitude=
    clamp(
      (cut-12)/58,
      .32,
      .76
    );

  const vertical=
    objectDistance>42
      ?-.28
      :objectDistance<16
        ?.24
        :0;

  const vector=
    V(
      signedTurn>=0
        ?sideMagnitude
        :-sideMagnitude,
      vertical
    );

  return{
    vector,
    text:shortSpinText(vector)
  };
}

function shotCall(s){

  const tip=
    tipCall(s);

  return{
    tip:tip,
    tipVector:tip.vector,
    tipText:tip.text,
    objectVector:objectContactDirection(s),
    objectText:faceText(
      objectContactDirection(s)
    ),
    targetVector:targetContactDirection(s),
    targetText:faceText(
      targetContactDirection(s)
    )
  };
}

/* ============================================================
   POCKET LANGUAGE
   ============================================================ */

function pocketShortName(
  pocket
){

  if(!pocket){
    return"the pocket";
  }

  return pocket.name;
}

/* ============================================================
   SHOT INSTRUCTION
   ============================================================ */

/*
  Short, glanceable language. In a real game there is no time
  to read a paragraph, so the call is delivered as three short
  lines: cue ball, contact, pocket.
*/

function shortSpinText(vector){

  if(!vector){
    return"Center ball";
  }

  const vertical=
    vector.y<=-.18
      ?"Top spin"
      :vector.y>=.18
        ?"Draw"
        :"";

  const horizontal=
    vector.x<=-.18
      ?"Left English"
      :vector.x>=.18
        ?"Right English"
        :"";

  if(vertical&&horizontal){
    return vertical+", "+horizontal;
  }

  if(vertical){
    return vertical+", no English";
  }

  if(horizontal){
    return"Center height, "+horizontal;
  }

  return"Center ball, no English";
}

function shortFaceText(direction){

  if(
    !direction||
    len(direction)<.02
  ){
    return"dead center";
  }

  const x=direction.x;
  const y=direction.y;

  const ax=Math.abs(x);
  const ay=Math.abs(y);

  if(
    ax<.15&&
    ay<.15
  ){
    return"dead center";
  }

  const side=
    ax>=ay
      ?(x<0?"left":"right")
      :(y<0?"top":"bottom");

  const amount=
    Math.max(ax,ay);

  const depth=
    amount>=.8
      ?"edge"
      :amount>=.45
        ?"half ball"
        :"just off center";

  if(depth==="edge"){
    return side+" edge";
  }

  if(depth==="half ball"){
    return"half ball "+side;
  }

  return"just "+side+" of center";
}

function callLine(step,text){

  return(
    `<div class="call-line">`+
    `<span class="call-step">${step}</span>`+
    `<span class="call-text">${text}</span>`+
    `</div>`
  );
}

function instructionHTML(s){
  if(!s){
    if(
      state.object&&
      state.object.number===8&&
      state.tableBalls.some(
        ball=>
          ball.number!==8&&
          ball.owner==="my"
      )
    ){
      return callLine("8-Ball","Clear your player's balls before shooting the 8-ball.");
    }

    return callLine(
      "Setup",
      state.mode==="combo"
        ?"Choose a player's ball and a target ball on the table."
        :"Place the cue ball and target ball on the felt."
    );
  }

  const call=shotCall(s);
  const pocketMarkup=`<span class="highlight">${pocketShortName(s.pocket)}</span>`;
  const spinMarkup=`<span class="highlight">${shortSpinText(call.tipVector)}</span>`;
  const objectFace=shortFaceText(call.objectVector);
  const objectNumber=s.kind==="combination"
    ?s.combinationBall.number
    :state.object.number;
  const ballMarkup=`<span class="neutral-emphasis">${objectNumber}</span>`;

  if(s.kind==="combination"){
    return callLine(
      "Call",
      `${spinMarkup}. Send the ${ballMarkup} into ${s.targetBall.number}, then finish at ${pocketMarkup}.`
    );
  }

  if(s.kind==="kick"){
    return callLine(
      "Call",
      `${spinMarkup}. Take the ${railText(s.rail)} first, then contact the ${ballMarkup}.`
    );
  }

  if(s.kind==="bank"){
    return callLine(
      "Call",
      `${spinMarkup}. Hit the ${ballMarkup} ${objectFace}, using the ${railText(s.rail)}.`
    );
  }

  return callLine(
    "Call",
    s.kind==="straight"
      ?`${spinMarkup}. Center the ${ballMarkup} and send it to ${pocketMarkup}.`
      :`${spinMarkup}. Contact the ${ballMarkup} ${objectFace}; the visual route ends at ${pocketMarkup}.`
  );
}

/* ============================================================
   RAIL TEXT
   ============================================================ */

function railText(rail){

  const names={
    top:"top rail",
    bottom:"bottom rail",
    left:"left rail",
    right:"right rail"
  };

  return names[rail]||"rail";
}

/* ============================================================
   SCREEN GEOMETRY
   ============================================================ */

function geometry(){
  const w=canvas.width;
  const h=canvas.height;
  const inset=Math.min(w,h)*.085;
  const baseW=w-inset*2;
  const baseH=h-inset*2;
  /*
    The table is presented through a small, deliberate viewport zoom.
    All drawing and pointer conversion use this same expanded geometry,
    so the felt, pockets, balls and shot routes remain one coordinate system.
  */
  const zoom=w<620?1.06:1.10;
  return{
    x:(w-baseW*zoom)/2,
    y:(h-baseH*zoom)/2,
    w:baseW*zoom,
    h:baseH*zoom,
    zoom
  };
}

function toScreen(p){

  const g=geometry();

  return V(
    g.x+
      p.x/TABLE_W*
      g.w,

    g.y+
      p.y/TABLE_H*
      g.h
  );
}

function fromScreen(
  clientX,
  clientY
){

  const rect=
    canvas.getBoundingClientRect();

  const g=geometry();

  const px=
    (clientX-rect.left)*
    canvas.width/
    rect.width;

  const py=
    (clientY-rect.top)*
    canvas.height/
    rect.height;

  return V(
    (px-g.x)/
      g.w*
      TABLE_W,

    (py-g.y)/
      g.h*
      TABLE_H
  );
}

/* ============================================================
   TABLE DRAWING
   ============================================================ */

function roundedRect(
  c,
  x,
  y,
  w,
  h,
  r
){

  c.beginPath();

  c.moveTo(
    x+r,
    y
  );

  c.arcTo(
    x+w,
    y,
    x+w,
    y+h,
    r
  );

  c.arcTo(
    x+w,
    y+h,
    x,
    y+h,
    r
  );

  c.arcTo(
    x,
    y+h,
    x,
    y,
    r
  );

  c.arcTo(
    x,
    y,
    x+w,
    y,
    r
  );

  c.closePath();
}

function drawTable(){

  const w=canvas.width;
  const h=canvas.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  const g=geometry();

  const wood=
    ctx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  wood.addColorStop(
    0,
    "#624326"
  );

  wood.addColorStop(
    .5,
    "#2e1d11"
  );

  wood.addColorStop(
    1,
    "#4b2e18"
  );

  ctx.fillStyle=wood;

  roundedRect(
    ctx,
    0,
    0,
    w,
    h,
    Math.min(w,h)*.035
  );

  ctx.fill();

  const felt=
    ctx.createLinearGradient(
      0,
      g.y,
      0,
      g.y+g.h
    );

  felt.addColorStop(
    0,
    "#197755"
  );

  felt.addColorStop(
    .5,
    "#146447"
  );

  felt.addColorStop(
    1,
    "#10533a"
  );

  ctx.fillStyle=felt;

  ctx.fillRect(
    g.x,
    g.y,
    g.w,
    g.h
  );

  drawRails(g);
  ctx.strokeStyle=
    "rgba(7,6,4,.95)";

  ctx.lineWidth=
    Math.max(
      2,
      Math.min(w,h)*.018
    );

  ctx.strokeRect(
    g.x,
    g.y,
    g.w,
    g.h
  );

  drawDiamonds(g);
  drawPockets(g);
}

/*
  The original cloth rectangle already established the physical
  table viewport. These four visible cushion faces are purely a
  presentation layer around that same viewport; the solver still
  uses the unchanged RAIL constants above.
*/
function drawRails(g){
  const depth=Math.max(5,Math.min(canvas.width,canvas.height)*.035);
  const railGradient=ctx.createLinearGradient(0,0,0,canvas.height);
  railGradient.addColorStop(0,"#6d4a28");
  railGradient.addColorStop(.5,"#321e11");
  railGradient.addColorStop(1,"#4f3018");
  ctx.fillStyle=railGradient;

  ctx.fillRect(g.x-depth,g.y-depth,g.w+depth*2,depth);
  ctx.fillRect(g.x-depth,g.y+g.h,g.w+depth*2,depth);
  ctx.fillRect(g.x-depth,g.y,depth,g.h);
  ctx.fillRect(g.x+g.w,g.y,depth,g.h);

  ctx.strokeStyle="rgba(245,204,142,.18)";
  ctx.lineWidth=Math.max(1,depth*.12);
  ctx.strokeRect(g.x-depth*.35,g.y-depth*.30,g.w+depth*.70,g.h+depth*.60);
}

/* ============================================================
   DIAMONDS
   ============================================================ */

function drawDiamonds(g){

  const size=Math.max(
    2.5,
    Math.min(
      g.w,
      g.h
    )*.017
  );

  function diamond(
    x,
    y
  ){

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      Math.PI/4
    );

    ctx.fillStyle=
      "rgba(240,214,168,.72)";

    ctx.fillRect(
      -size/2,
      -size/2,
      size,
      size
    );

    ctx.restore();
  }

  [
    .125,
    .25,
    .375,
    .5,
    .625,
    .75,
    .875
  ].forEach(t=>{

    diamond(
      g.x+g.w*t,
      g.y-size*.72
    );

    diamond(
      g.x+g.w*t,
      g.y+g.h+size*.72
    );

  });

  [
    .25,
    .5,
    .75
  ].forEach(t=>{

    diamond(
      g.x-size*.72,
      g.y+g.h*t
    );

    diamond(
      g.x+g.w+size*.72,
      g.y+g.h*t
    );

  });
}

/* ============================================================
   POCKETS
   ============================================================ */

function drawPockets(g){

  const outerRadius=
    POCKET_SIZE/
    TABLE_W*
    g.w/2;

  POCKETS.forEach(
    pocket=>{

      const p=
        toScreen(pocket);

      const selected=
        state.selectedPocket&&
        state.selectedPocket.id===
        pocket.id;

      const suggested=
        state.solution&&
        state.solution.pocket.id===
        pocket.id;

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius*1.12,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#21160d";

      ctx.fill();

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius,
        0,
        Math.PI*2
      );

      ctx.fillStyle="#020202";

      ctx.fill();

      const pocketShade=
        ctx.createRadialGradient(
          p.x-
            outerRadius*.28,
          p.y-
            outerRadius*.30,
          outerRadius*.08,
          p.x,
          p.y,
          outerRadius
        );

      pocketShade.addColorStop(
        0,
        "#090909"
      );

      pocketShade.addColorStop(
        .72,
        "#010101"
      );

      pocketShade.addColorStop(
        1,
        "#000000"
      );

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        outerRadius*.86,
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        pocketShade;

      ctx.fill();

      ctx.restore();

      if(
        selected||
        suggested
      ){

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          outerRadius*1.35,
          0,
          Math.PI*2
        );

        ctx.strokeStyle=
          selected
            ?"rgba(217,255,63,.95)"
            :"rgba(217,255,63,.55)";

        ctx.lineWidth=2;

        ctx.stroke();
      }

    }
  );
}

/* ============================================================
   ROUTES + VISIBLE GHOST BALL
   ============================================================ */

function drawLine(
  a,
  b,
  color,
  width,
  dashed=false
){

  const A=toScreen(a);
  const B=toScreen(b);

  ctx.beginPath();

  ctx.moveTo(
    A.x,
    A.y
  );

  ctx.lineTo(
    B.x,
    B.y
  );

  ctx.strokeStyle=color;

  ctx.lineWidth=width;

  ctx.lineCap="round";

  ctx.setLineDash(
    dashed
      ?[7,7]
      :[]
  );

  ctx.stroke();

  ctx.setLineDash([]);
}

function drawGhostBall(
  position,
  emphasized=false
){

  if(!position){
    return;
  }

  const g=geometry();

  const p=
    toScreen(position);

  const radius=
    BALL_RADIUS/
    TABLE_W*
    g.w;

  /*
    The ghost ball is intentionally much more visible than
    before: translucent white fill + lime outline + dashed
    circumference. It remains physically sized to the ball.
  */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    emphasized
      ?"rgba(255,255,255,.15)"
      :"rgba(255,255,255,.10)";

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    emphasized
      ?"rgba(217,255,63,.95)"
      :"rgba(217,255,63,.82)";

  ctx.lineWidth=
    Math.max(
      2,
      radius*.075
    );

  ctx.setLineDash(
    [6,5]
  );

  ctx.stroke();

  ctx.setLineDash([]);

  /*
    Center point makes the actual ghost-ball position obvious
    without pretending that the ghost ball is another ball.
  */
  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    Math.max(
      1.5,
      radius*.10
    ),
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(217,255,63,.95)";

  ctx.fill();

  ctx.restore();
}

function drawRoute(){

  const s=state.solution;

  if(!s){
    return;
  }

  const lineWidth=
    Math.max(
      2,
      canvas.width*.0026
    );

  if(
    s.kind==="combination"
  ){

    drawLine(
      state.cue,
      s.firstContactPoint,
      "#ffffff",
      lineWidth,
      false
    );

    /*
      Ghost ball for the cue ball contacting the player's ball.
    */
    drawGhostBall(
      s.firstContactPoint,
      true
    );

    drawLine(
      s.combinationBall,
      s.secondContactPoint,
      "#45d9ff",
      lineWidth,
      true
    );

    /*
      Contact ghost for the target ball.
    */
    drawGhostBall(
      s.secondContactPoint,
      false
    );

    drawLine(
      s.targetBall,
      s.target,
      "#45d9ff",
      lineWidth,
      true
    );

    return;
  }

  if(
    s.kind==="kick"
  ){

    drawLine(
      state.cue,
      s.bankPoint,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      s.bankPoint,
      s.ghost,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      state.object,
      s.target,
      "#45d9ff",
      lineWidth,
      true
    );

    drawGhostBall(
      s.ghost,
      true
    );

    return;
  }

  if(
    s.kind==="bank"
  ){

    drawLine(
      state.cue,
      s.ghost,
      "#ffffff",
      lineWidth,
      false
    );

    drawLine(
      state.object,
      s.bankPoint,
      "#ff9f43",
      lineWidth+1,
      false
    );

    drawLine(
      s.bankPoint,
      s.target,
      "#ff9f43",
      lineWidth+1,
      false
    );

  }else{

    drawLine(
      state.cue,
      s.ghost,
      "#ffffff",
      lineWidth,
      false
    );

    drawLine(
      state.object,
      s.target,
      "#45d9ff",
      lineWidth,
      true
    );
  }

  /*
    ALWAYS render the physical ghost ball for normal direct
    and bank shots.
  */
  drawGhostBall(
    s.ghost,
    true
  );
}

function drawPoolBall(
  position,
  number,
  selected=false,
  role="obstacle"
){

  const g=geometry();

  const p=
    toScreen(position);

  const radius=
    BALL_RADIUS/
    TABLE_W*
    g.w;

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x+radius*.10,
    p.y+radius*.12,
    radius*1.01,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(0,0,0,.24)";

  ctx.fill();

  ctx.restore();

  const ball=
    BALL_MAP[number];

  if(!ball){
    return;
  }

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.clip();

  const gradient=
    ctx.createRadialGradient(
      p.x-radius*.36,
      p.y-radius*.42,
      radius*.03,
      p.x,
      p.y,
      radius
    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .18,
    ball.color
  );

  gradient.addColorStop(
    .82,
    ball.color
  );

  gradient.addColorStop(
    1,
    "#111111"
  );

  ctx.fillStyle=gradient;

  ctx.fillRect(
    p.x-radius,
    p.y-radius,
    radius*2,
    radius*2
  );

  if(
    ball.type==="stripe"
  ){

    ctx.fillStyle="#f5f5f5";

    ctx.fillRect(
      p.x-radius,
      p.y-radius*.31,
      radius*2,
      radius*.62
    );
  }

  ctx.restore();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(255,255,255,.28)";

  ctx.lineWidth=
    Math.max(
      1,
      radius*.035
    );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius*.39,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#f8f8f8";

  ctx.fill();

  ctx.strokeStyle=
    "rgba(0,0,0,.55)";

  ctx.lineWidth=
    Math.max(
      1,
      radius*.035
    );

  ctx.stroke();

  ctx.fillStyle="#111";

  ctx.font=
    `900 ${Math.max(
      6,
      radius*.62
    )}px Arial`;

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText(
    number,
    p.x,
    p.y+.25
  );

  if(
    selected||
    role==="object"
  ){

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius*1.17,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      selected
        ?"rgba(217,255,63,.95)"
        :"rgba(217,255,63,.48)";

    ctx.lineWidth=
      Math.max(
        1.5,
        radius*.07
      );

    ctx.stroke();
  }

  if(
    role==="blocker"
  ){

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius*1.13,
      0,
      Math.PI*2
    );

    ctx.strokeStyle=
      "rgba(255,70,82,.55)";

    ctx.lineWidth=
      Math.max(
        1,
        radius*.045
      );

    ctx.stroke();

  if(
    role==="my"

      p.y,

      Math.PI*2

    ctx.strokeStyle=
      "rgba(69,217,255,.65)";

    ctx.lineWidth=
      Math.max(
        1,
        radius*.045
      );

    ctx.stroke();
  }
